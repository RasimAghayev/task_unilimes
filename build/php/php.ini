# The settings of the runtime image.
#
# A notice of PHP must never reach the body of a response: the body of an
# export or a redirect would be wrong, and the header of the file would be
# lost. The notices go to the log of the container instead.

display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

expose_php = Off
date.timezone = UTC
