name: CI

# The whole quality gate runs inside the project's own Docker images, so the
# runner needs a Docker daemon and nothing else. No PHP toolchain is
# installed on the runner.
on:
  push:
    branches: [master, test]
  pull_request:
    branches: [master, test]

# The pipeline only reads the repository. It never publishes anything and never
# writes to the GitHub API.
permissions:
  contents: read

jobs:
  quality-gates:
    name: Docker quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create the local environment file
        # Every bind mount of the compose stack lives under var/ (R92). The
        # values are the placeholders of .env.example.
        run: |
          mkdir -p var
          cp .env.example var/.env

      - name: Validate the compose file
        run: docker compose config --quiet

      - name: Build the test image
        run: docker compose build test

      - name: Run the test suite
        run: docker compose --profile test run --rm test

      - name: Build the application image
        run: docker compose build php

      - name: Build the database image
        run: docker compose build mysql
